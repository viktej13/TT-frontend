# ===================================================================
# Standalone In-Memory Profile (H2 in MySQL mode)
# Useful for instant testing without requiring a MySQL password
# ===================================================================
spring.datasource.url=jdbc:h2:mem:smart_campus_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
