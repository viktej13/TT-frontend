# ===================================================================
# Smart Campus Service Management System (SCSMS)
# Configuration Properties
# ===================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=smart-campus-sms

# MySQL Database Configuration
# Connects to MySQL on localhost:3306 and automatically creates database smart_campus_db if not present
# Credentials are read securely from environment variables or command-line args (no hardcoded passwords)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_campus_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/

# JSON / Jackson Settings
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC
