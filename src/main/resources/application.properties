# ===================================================================
# Smart Campus Service Management System (SCSMS)
# PostgreSQL & Production Configuration
# ===================================================================

# Server Configuration (Render binds to $PORT dynamically)
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Name
spring.application.name=smart-campus-sms

# PostgreSQL Database Configuration
# Supports standard JDBC parameters or Render's DATABASE_URL via DatabaseConfig
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_campus_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# JPA / Hibernate Configuration
# Default is 'update' to safely alter schema without dropping tables
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/

# JSON / Jackson Settings
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC

# Spring Boot Actuator (Health Checks for Render deployment)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# CORS allowed origins for separated React frontend deployment
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Cookie & Session configuration for cross-origin React frontend support
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
